[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-compressor"
version = "0.1.0"
description = "TB-scale image compression tool for photos, manga, and CBZ archives"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyvips>=2.2.0",
    "Pillow>=10.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "numpy>=2.2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Full benchmark evaluators (PSNR is built-in; others need these)
benchmark = [
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
    "opencv-python-headless>=4.8.0",
]
# Manga-specific evaluators (FFT + edge detection)
manga = [
    "scipy>=1.10.0",
    "opencv-python-headless>=4.8.0",
    "scikit-image>=0.20.0",
]

[project.scripts]
image-compressor = "image_compressor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/image_compressor"]
